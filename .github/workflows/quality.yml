name: Contract quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ./scripts/check.sh

  integration-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-integration.txt
      - run: pip install -r requirements-integration.txt
      - name: Collect official gltest suite without network transactions
        run: python -m pytest --collect-only -q tests_integration
